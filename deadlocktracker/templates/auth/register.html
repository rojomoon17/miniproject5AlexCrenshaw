{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Register{% endblock %}</h1>
{% endblock %}

{% block content %}
  <div class="row">
    <div class="col-md-6 col-lg-5">
      <form method="post" class="card card-body">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input class="form-control" name="username" id="username" value="{{ username }}"
                 maxlength="30" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" name="password" id="password" minlength="6"
                 required aria-describedby="passwordHelp">
          <div id="passwordHelp" class="form-text">At least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-warning">Create account</button>
        <p class="mt-3 mb-0 small">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
      </form>
    </div>
  </div>
{% endblock %}
